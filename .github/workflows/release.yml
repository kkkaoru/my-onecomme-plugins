name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter @my-onecomme-plugins/flow-comment build
      - run: bun scripts/pack-release.mjs
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/plugin_flow-comment.zip dist/template_flow-comment.zip --generate-notes --title "$GITHUB_REF_NAME" --notes "プラグインは plugin_flow-comment.zip を展開してフォルダを置く。テンプレートは template_flow-comment.zip を一覧へドロップする（展開しない）。Source code は使わないでください。"
