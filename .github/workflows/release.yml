name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter @my-onecomme-plugins/flow-comment build
      - run: bun scripts/pack-release.mjs
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/flow-comment.zip dist/flow-comment-template.zip --generate-notes --title "$GITHUB_REF_NAME" --notes "配布は flow-comment.zip（プラグイン）と flow-comment-template.zip（テンプレート）です。Source code は使わないでください。"
